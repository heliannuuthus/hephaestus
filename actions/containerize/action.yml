name: Containerize
description: Build and push Docker image to GitHub Container Registry

inputs:
  workdir:
    description: Working directory (Dockerfile location)
    required: false
    default: "./"
  context:
    description: Docker build context relative to the repository root
    required: false
    default: ""
  dockerfile:
    description: Dockerfile path relative to the build context
    required: false
    default: "Dockerfile"
  image-name:
    description: Fully qualified image name; defaults to ghcr.io/<owner>/<repository>
    required: false
    default: ""
  build-args:
    description: Optional newline-delimited Docker build arguments
    required: false
    default: ""
  release-tags:
    description: Publish the exact version plus sha-* instead of legacy prerelease tags
    required: false
    default: "false"
  version:
    description: Image version tag
    required: true
  targets:
    description: Optional build artifact download path
    required: false
    default: ""
  artifact-name:
    description: Artifact name used when targets is set
    required: false
    default: "targets"

outputs:
  image:
    description: Published image name
    value: ${{ steps.config.outputs.image }}
  digest:
    description: Published image digest
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Download build artifacts
      if: inputs.targets != ''
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.targets }}

    - id: config
      name: Resolve image and build context
      shell: bash
      env:
        INPUT_CONTEXT: ${{ inputs.context }}
        INPUT_IMAGE_NAME: ${{ inputs.image-name }}
        INPUT_RELEASE_TAGS: ${{ inputs.release-tags }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_WORKDIR: ${{ inputs.workdir }}
      run: |
        set -euo pipefail
        if [ "$INPUT_RELEASE_TAGS" = "true" ] && \
          ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Release container versions must be stable semver (for example 1.2.3): $INPUT_VERSION"
          exit 1
        fi

        image="$INPUT_IMAGE_NAME"
        if [ -z "$image" ]; then
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
        fi

        context="$INPUT_CONTEXT"
        if [ -z "$context" ]; then
          context="$INPUT_WORKDIR"
        fi

        {
          echo "context=$context"
          echo "image=$image"
        } >> "$GITHUB_OUTPUT"

    - id: legacy
      name: Generate legacy tag metadata
      if: inputs.release-tags != 'true'
      shell: bash
      run: |
        echo "timestamp=$(date +%Y%m%d | cut -c 3-8)" >> "$GITHUB_OUTPUT"
        echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

    - id: meta
      name: Docker metadata
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.config.outputs.image }}
        tags: |
          type=raw,enable=${{ inputs.release-tags == 'true' }},value=${{ inputs.version }}
          type=sha,enable=${{ inputs.release-tags == 'true' }},prefix=sha-
          type=semver,enable=${{ inputs.release-tags != 'true' && github.ref == format('refs/heads/{0}', 'main') }},pattern=${{ inputs.version }}-${{ steps.legacy.outputs.timestamp }}rc-${{ steps.legacy.outputs.short_sha }},value=${{ inputs.version || 'v0.0.1' }}
          type=semver,enable=${{ inputs.release-tags != 'true' && github.ref != format('refs/heads/{0}', 'main') }},pattern=${{ inputs.version }}-${{ steps.legacy.outputs.timestamp }}alpha-${{ steps.legacy.outputs.short_sha }},value=${{ inputs.version || 'v0.0.1' }}

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - id: build
      name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: ${{ steps.config.outputs.context }}
        file: ${{ steps.config.outputs.context }}/${{ inputs.dockerfile }}
        build-args: ${{ inputs.build-args }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
