name: Setup pnpm (Frontend)
description: Compatibility wrapper around setup-node with pnpm

inputs:
  workdir:
    description: Working directory
    required: false
    default: "./"
  node-version:
    description: Node.js version
    required: false
    default: "lts/*"
  registry-url:
    description: npm registry URL (set to enable auth via NODE_AUTH_TOKEN)
    required: false
    default: ""

outputs:
  package-manager:
    description: Resolved package manager
    value: ${{ steps.setup.outputs.package-manager }}
  run-cmd:
    description: Script runner command prefix
    value: ${{ steps.setup.outputs.run-cmd }}

runs:
  using: composite
  steps:
    - id: setup
      uses: heliannuuthus/hephaestus/actions/setup-node@main
      with:
        workdir: ${{ inputs.workdir }}
        node-version: ${{ inputs.node-version }}
        package-manager: pnpm
        registry-url: ${{ inputs.registry-url }}
