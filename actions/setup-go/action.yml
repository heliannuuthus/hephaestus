name: Setup Go
description: Setup Go environment with module cache and CI tools

inputs:
  workdir:
    description: Working directory
    required: false
    default: "./"
  gosec-version:
    description: gosec version
    required: false
    default: "2.24.7"
  gotestsum-version:
    description: gotestsum version
    required: false
    default: "1.13.0"

runs:
  using: composite
  steps:
    - id: detect
      name: Detect Go version file
      shell: bash
      run: |
        workdir="${{ inputs.workdir }}"
        case "$workdir" in
          */) ;;
          *) workdir="$workdir/" ;;
        esac
        echo "workdir=$workdir" >> "$GITHUB_OUTPUT"

        if [ -f "${workdir}go.work" ]; then
          echo "version_file=go.work" >> "$GITHUB_OUTPUT"
        elif [ -f "${workdir}go.mod" ]; then
          echo "version_file=go.mod" >> "$GITHUB_OUTPUT"
        else
          echo "::error::No go.work or go.mod found in ${{ inputs.workdir }}"
          exit 1
        fi

    - uses: actions/setup-go@v5
      with:
        go-version-file: ${{ steps.detect.outputs.workdir }}${{ steps.detect.outputs.version_file }}
        cache: true
        cache-dependency-path: |
          ${{ steps.detect.outputs.workdir }}go.sum
          ${{ steps.detect.outputs.workdir }}**/go.sum

    - name: Install gosec
      shell: bash
      run: |
        GOSEC_VERSION="${{ inputs.gosec-version }}"
        curl -sfL "https://github.com/securego/gosec/releases/download/v${GOSEC_VERSION}/gosec_${GOSEC_VERSION}_linux_amd64.tar.gz" \
          | tar -xz -C /usr/local/bin gosec

    - name: Install gotestsum
      shell: bash
      run: |
        GOTESTSUM_VERSION="${{ inputs.gotestsum-version }}"
        curl -sfL "https://github.com/gotestyourself/gotestsum/releases/download/v${GOTESTSUM_VERSION}/gotestsum_${GOTESTSUM_VERSION}_linux_amd64.tar.gz" \
          | tar -xz -C /usr/local/bin gotestsum
