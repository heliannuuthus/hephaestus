name: golang

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project:
    uses: ./.github/workflows/ci-golang.yml
    permissions:
      contents: read
    with:
      workdir: "tests/golang/"
      ENTRANCE: cmd/main.go
