name: Publish Node Package

on:
  workflow_call:
    inputs:
      workdir:
        required: false
        default: "./"
        type: string
        description: Working directory
      node-version:
        required: false
        default: "lts/*"
        type: string
        description: Node.js version
      package-manager:
        required: false
        default: "auto"
        type: string
        description: "Package manager: auto, pnpm, npm, or yarn"
      build:
        required: false
        default: ""
        type: string
        description: Build script name to run before publishing; set to empty to skip
      registry-url:
        required: false
        default: "https://registry.npmjs.org"
        type: string
        description: npm registry URL

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: setup
        uses: heliannuuthus/hephaestus/actions/setup-node@main
        with:
          workdir: ${{ inputs.workdir }}
          node-version: ${{ inputs.node-version }}
          package-manager: ${{ inputs.package-manager }}
          registry-url: ${{ inputs.registry-url }}

      - name: Upgrade npm
        run: npm install -g npm@latest

      - uses: heliannuuthus/hephaestus/actions/version@main
        id: version
        with:
          workdir: ${{ inputs.workdir }}
          lang: node

      - name: Set publish version
        shell: bash
        working-directory: ${{ inputs.workdir }}
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build
        if: inputs.build != ''
        working-directory: ${{ inputs.workdir }}
        run: ${{ steps.setup.outputs.run-cmd }} "${{ inputs.build }}"

      - name: Publish
        working-directory: ${{ inputs.workdir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            unset NODE_AUTH_TOKEN
          fi

          if [ "${{ steps.setup.outputs.package-manager }}" = "pnpm" ]; then
            pnpm publish --no-git-checks --access public --provenance --tag "${{ steps.version.outputs.channel }}"
          else
            npm publish --access public --provenance --tag "${{ steps.version.outputs.channel }}"
          fi
