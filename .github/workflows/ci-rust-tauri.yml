name: CI Rust Tauri

on:
  workflow_call:
    inputs:
      workdir:
        required: false
        default: "./"
        type: string
        description: Working directory
      node-version:
        required: false
        default: "lts/*"
        type: string
        description: Node.js version
      package-manager:
        required: false
        default: "auto"
        type: string
        description: "Package manager: auto, pnpm, npm, or yarn"
      toolchain:
        required: false
        default: stable
        type: string
        description: Rust toolchain
      build:
        required: false
        default: build
        type: string
        description: Frontend build command
      test:
        required: false
        default: ""
        type: string
        description: Frontend test command
      release:
        required: false
        default: true
        type: boolean
        description: Create a draft GitHub Release; set false for build-only CI

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libayatana-appindicator3-dev \
            libglib2.0-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - id: setup
        uses: heliannuuthus/hephaestus/actions/setup-node@main
        with:
          workdir: ${{ inputs.workdir }}
          node-version: ${{ inputs.node-version }}
          package-manager: ${{ inputs.package-manager }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.toolchain }}
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "${{ inputs.workdir }}src-tauri"
          cache-targets: false

      - name: Resolve Tauri CLI command
        id: tauri
        shell: bash
        run: |
          case "${{ steps.setup.outputs.package-manager }}" in
            pnpm) echo "script=pnpm tauri" >> "$GITHUB_OUTPUT" ;;
            npm) echo "script=npx tauri" >> "$GITHUB_OUTPUT" ;;
            yarn) echo "script=yarn tauri" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: heliannuuthus/hephaestus/actions/version@main
        id: version
        with:
          workdir: ${{ inputs.workdir }}
          lang: rust

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: ${{ steps.tauri.outputs.script }}
          projectPath: ${{ inputs.workdir }}
          tagName: ${{ inputs.release && format('{0}-v__VERSION__', steps.version.outputs.project) || '' }}
          releaseName: ${{ inputs.release && format('{0} v__VERSION__', steps.version.outputs.project) || '' }}
          releaseBody: ${{ inputs.release && github.event.head_commit.message || '' }}
          releaseDraft: ${{ inputs.release }}
          prerelease: false
          args: --target ${{ matrix.target }}
