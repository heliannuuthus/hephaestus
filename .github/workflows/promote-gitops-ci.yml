name: promote-gitops

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test consumer-owned release scanner
        run: python3 -m unittest discover -s scripts -p 'test_auto_promote_gitops.py' -v
