name: promote-gitops

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test promote-gitops action
        run: python3 -m unittest discover -s tests/promote-gitops -v
