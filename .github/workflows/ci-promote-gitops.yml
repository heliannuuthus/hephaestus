name: CI Promote GitOps

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: Stable semantic version without a v prefix
      updates:
        required: true
        type: string
        description: Newline-delimited release-file=image mappings
      repository:
        required: false
        default: heliantheons/applications
        type: string
        description: GitOps repository to update
      branch:
        required: false
        default: main
        type: string
        description: Branch that receives the desired-state commit
      gitops_app_id:
        required: true
        type: string
        description: GitHub App ID used to mint a short-lived installation token
      gitops_app_owner:
        required: false
        default: heliantheons
        type: string
        description: Owner of the GitHub App installation
      gitops_app_repositories:
        required: false
        default: applications
        type: string
        description: Newline-delimited repositories granted to the installation token
    secrets:
      gitops_app_private_key:
        required: true
        description: Private key for the GitHub App selected by gitops_app_id
    outputs:
      changed:
        description: Whether the desired state changed
        value: ${{ jobs.promote.outputs.changed }}
      commit-sha:
        description: Resulting desired-state commit SHA
        value: ${{ jobs.promote.outputs.commit-sha }}

concurrency:
  group: gitops-${{ inputs.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.promote.outputs.changed }}
      commit-sha: ${{ steps.promote.outputs.commit-sha }}
    steps:
      - name: Create GitHub App installation token
        id: gitops-app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ inputs.gitops_app_id }}
          private-key: ${{ secrets.gitops_app_private_key }}
          owner: ${{ inputs.gitops_app_owner }}
          repositories: ${{ inputs.gitops_app_repositories }}
          permission-contents: write

      - name: Check out GitOps desired state
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.branch }}
          token: ${{ steps.gitops-app-token.outputs.token }}
          fetch-depth: 0

      - id: promote
        name: Promote desired state
        uses: heliannuuthus/hephaestus/actions/promote-gitops@main
        with:
          version: ${{ inputs.version }}
          updates: ${{ inputs.updates }}
          branch: ${{ inputs.branch }}
