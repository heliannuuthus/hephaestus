name: Release Node Package Tarball

on:
  workflow_call:
    inputs:
      workdir:
        required: false
        default: "./"
        type: string
        description: Working directory
      node-version:
        required: false
        default: "lts/*"
        type: string
        description: Node.js version
      package-manager:
        required: false
        default: "auto"
        type: string
        description: "Package manager: auto, pnpm, npm, or yarn"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: setup
        uses: heliannuuthus/hephaestus/actions/setup-node@main
        with:
          workdir: ${{ inputs.workdir }}
          node-version: ${{ inputs.node-version }}
          package-manager: ${{ inputs.package-manager }}

      - uses: heliannuuthus/hephaestus/actions/version@main
        id: version
        with:
          workdir: ${{ inputs.workdir }}
          lang: node

      - name: Require an exact release tag
        if: steps.version.outputs.channel != 'latest'
        run: |
          echo "::error::Node package releases require an exact v* tag"
          exit 1

      - name: Set release version
        shell: bash
        working-directory: ${{ inputs.workdir }}
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build package tarball
        id: pack
        uses: heliannuuthus/hephaestus/actions/pack-node@main
        with:
          workdir: ${{ inputs.workdir }}
          package-manager: ${{ steps.setup.outputs.package-manager }}
          destination: ${{ runner.temp }}/node-package-release

      - name: Publish GitHub Release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_PATH: ${{ steps.pack.outputs.path }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$PACKAGE_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$PACKAGE_PATH" \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
