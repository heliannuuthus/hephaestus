name: CI Frontend

on:
  workflow_call:
    inputs:
      workdir:
        required: false
        default: "./"
        type: string
        description: Working directory
      node-version:
        required: false
        default: "lts/*"
        type: string
        description: Node.js version
      package-manager:
        required: false
        default: "auto"
        type: string
        description: "Package manager: auto, pnpm, npm, or yarn"
      build:
        required: false
        default: build
        type: string
        description: Build script name
      type-check:
        required: false
        default: ""
        type: string
        description: Type-check script name; set to empty to skip type checking
      test:
        required: false
        default: ""
        type: string
        description: Test script name
      pack:
        required: false
        default: false
        type: boolean
        description: Run package pack after a successful build
      registry-url:
        required: false
        default: ""
        type: string
        description: npm registry URL for scoped package auth
    outputs:
      project:
        value: ${{ jobs.build.outputs.project }}
        description: Project name
      version:
        value: ${{ jobs.build.outputs.version }}
        description: Build version
      channel:
        value: ${{ jobs.build.outputs.channel }}
        description: Build channel

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: setup
        uses: heliannuuthus/hephaestus/actions/setup-node@main
        with:
          workdir: ${{ inputs.workdir }}
          node-version: ${{ inputs.node-version }}
          package-manager: ${{ inputs.package-manager }}
          registry-url: ${{ inputs.registry-url }}

  lint:
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: setup
        uses: heliannuuthus/hephaestus/actions/setup-node@main
        with:
          workdir: ${{ inputs.workdir }}
          node-version: ${{ inputs.node-version }}
          package-manager: ${{ inputs.package-manager }}
          registry-url: ${{ inputs.registry-url }}
      - name: Lint
        working-directory: ${{ inputs.workdir }}
        run: |
          ${{ steps.setup.outputs.run-cmd }} lint
          ${{ steps.setup.outputs.run-cmd }} format:check
      - name: Type check
        if: inputs.type-check != ''
        working-directory: ${{ inputs.workdir }}
        run: ${{ steps.setup.outputs.run-cmd }} "${{ inputs.type-check }}"

  build:
    needs: [lint]
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.version.outputs.project }}
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: setup
        uses: heliannuuthus/hephaestus/actions/setup-node@main
        with:
          workdir: ${{ inputs.workdir }}
          node-version: ${{ inputs.node-version }}
          package-manager: ${{ inputs.package-manager }}
          registry-url: ${{ inputs.registry-url }}
      - name: Build
        if: inputs.build != ''
        working-directory: ${{ inputs.workdir }}
        run: ${{ steps.setup.outputs.run-cmd }} "${{ inputs.build }}"
      - name: Test
        if: inputs.test != ''
        working-directory: ${{ inputs.workdir }}
        run: ${{ steps.setup.outputs.run-cmd }} "${{ inputs.test }}"
      - name: Pack
        if: inputs.pack
        uses: heliannuuthus/hephaestus/actions/pack-node@main
        with:
          workdir: ${{ inputs.workdir }}
          package-manager: ${{ steps.setup.outputs.package-manager }}
          destination: ${{ runner.temp }}/node-pack
      - uses: heliannuuthus/hephaestus/actions/version@main
        id: version
        with:
          workdir: ${{ inputs.workdir }}
          lang: node
